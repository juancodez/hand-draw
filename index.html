<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand Draw</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #050507;
  overflow: hidden;
  font-family: 'SF Pro Display', system-ui, -apple-system, sans-serif;
}

#cam {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
  opacity: 0.25;
  filter: saturate(0.5);
}

#draw {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

#cursor {
  position: fixed;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.9);
  box-shadow: 0 0 12px rgba(255,255,255,0.6), 0 0 24px rgba(255,255,255,0.2);
  transform: translate(-50%, -50%);
  pointer-events: none;
  transition: transform 0.05s, width 0.15s, height 0.15s, background 0.15s;
  z-index: 10;
}
#cursor.erase {
  width: 48px;
  height: 48px;
  background: rgba(255,100,100,0.15);
  box-shadow: 0 0 0 1.5px rgba(255,100,100,0.4);
}
#cursor.hidden { opacity: 0; }

/* Status */
#status {
  position: fixed;
  top: 28px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.25);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  pointer-events: none;
  z-index: 10;
  transition: opacity 0.4s;
}

/* Mode badge */
#mode {
  position: fixed;
  top: 28px;
  right: 32px;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.2);
  pointer-events: none;
  z-index: 10;
  transition: color 0.2s;
}
#mode.draw { color: rgba(180,210,255,0.7); }
#mode.erase { color: rgba(255,120,120,0.7); }

/* Footer */
#footer {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 14px 28px 18px;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(24px) saturate(1.4);
  -webkit-backdrop-filter: blur(24px) saturate(1.4);
  border: 1px solid rgba(255,255,255,0.07);
  border-bottom: none;
  border-radius: 20px 20px 0 0;
  z-index: 20;
}

.sep {
  width: 1px;
  height: 20px;
  background: rgba(255,255,255,0.08);
  flex-shrink: 0;
}

/* Color swatches */
.swatch {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  outline: none;
  flex-shrink: 0;
  transition: border-color 0.2s, transform 0.15s;
}
.swatch:hover { transform: scale(1.2); }
.swatch.active { border-color: rgba(255,255,255,0.7); }

/* Slider */
input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 72px;
  height: 2px;
  background: rgba(255,255,255,0.15);
  border-radius: 1px;
  outline: none;
  cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: rgba(255,255,255,0.85);
  cursor: pointer;
  transition: transform 0.15s;
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }

/* Clear button */
#clear-btn {
  background: none;
  border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.4);
  padding: 5px 14px;
  border-radius: 100px;
  cursor: pointer;
  font-size: 11px;
  letter-spacing: 0.1em;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
  font-family: inherit;
}
#clear-btn:hover {
  background: rgba(255,255,255,0.07);
  color: rgba(255,255,255,0.7);
  border-color: rgba(255,255,255,0.2);
}
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>
<canvas id="draw"></canvas>
<div id="cursor" class="hidden"></div>
<div id="status">Initialising hand tracking…</div>
<div id="mode">—</div>

<div id="footer">
  <!-- Colors -->
  <div class="swatch active" data-color="255,255,255"   style="background:rgb(255,255,255)"></div>
  <div class="swatch"        data-color="140,190,255"   style="background:rgb(140,190,255)"></div>
  <div class="swatch"        data-color="180,140,255"   style="background:rgb(180,140,255)"></div>
  <div class="swatch"        data-color="120,255,190"   style="background:rgb(120,255,190)"></div>
  <div class="swatch"        data-color="255,200,100"   style="background:rgb(255,200,100)"></div>

  <div class="sep"></div>

  <!-- Brush size -->
  <input type="range" id="size" min="2" max="28" value="5" title="Brush size">

  <div class="sep"></div>

  <button id="clear-btn">Clear</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
const video    = document.getElementById('cam');
const canvas   = document.getElementById('draw');
const ctx      = canvas.getContext('2d');
const cursor   = document.getElementById('cursor');
const statusEl = document.getElementById('status');
const modeEl   = document.getElementById('mode');
const sizeEl   = document.getElementById('size');
const clearBtn = document.getElementById('clear-btn');

// State
let color   = [255, 255, 255];
let brushPx = 5;

// Drawing EMA — smooths the stroke path only; cursor is raw (no lag)
const DRW_EMA = 0.45; // higher = stroke tracks finger closely with less lag
const drwAcc  = [null, null];
function smoothDraw(x, y) {
  if (drwAcc[0] === null) { drwAcc[0] = x; drwAcc[1] = y; return { x, y }; }
  drwAcc[0] += (x - drwAcc[0]) * DRW_EMA;
  drwAcc[1] += (y - drwAcc[1]) * DRW_EMA;
  return { x: drwAcc[0], y: drwAcc[1] };
}

// Catmull-rom drawing buffer
let pt1 = null; // prev-prev anchor
let pt2 = null; // prev anchor
const MIN_DIST = 3; // px — tighter threshold = more anchors = smoother curve

function resetDrawState() {
  pt1 = null; pt2 = null;
  drwAcc[0] = null; drwAcc[1] = null;
}
const resetAll = resetDrawState;

function mid(a, b) { return { x: (a.x + b.x) * 0.5, y: (a.y + b.y) * 0.5 }; }
function dist(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}

// Resize canvas — keep existing drawing
function resize() {
  const tmp = canvas.toDataURL();
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const img = new Image();
  img.onload = () => ctx.drawImage(img, 0, 0);
  img.src = tmp;
}
resize();
window.addEventListener('resize', resize);

// Color swatches
document.querySelectorAll('.swatch').forEach(s => {
  s.addEventListener('click', () => {
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
    s.classList.add('active');
    color = s.dataset.color.split(',').map(Number);
  });
});

sizeEl.addEventListener('input', () => { brushPx = +sizeEl.value; });
clearBtn.addEventListener('click', () => ctx.clearRect(0, 0, canvas.width, canvas.height));

// MediaPipe landmark indices
const PALM_CTR = 9; // middle-finger MCP ≈ palm center

// 2-D only — MediaPipe's z is unreliable in normalised image coords
function d2(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return dx * dx + dy * dy;
}

// Extended = tip farther from wrist than PIP (2-D, any hand angle)
function fingerUp(lm, tip, pip) {
  return d2(lm[tip], lm[0]) > d2(lm[pip], lm[0]);
}

// Draw mode: index extended + middle curled.
// Ring/pinky position ignored — they naturally semi-extend when pointing
// and requiring them curled causes frequent false negatives mid-stroke.
function isIndexOnly(lm) {
  return fingerUp(lm, 8, 6) && !fingerUp(lm, 12, 10);
}

// Erase mode: 3+ fingers extended
function isErasing(lm) {
  return [fingerUp(lm,8,6), fingerUp(lm,12,10), fingerUp(lm,16,14), fingerUp(lm,20,18)]
    .filter(Boolean).length >= 3;
}

// Smooth quadratic-bezier segment (catmull-rom midpoint style)
function drawSegment(from, ctrl, to, erase, radius) {
  ctx.save();
  ctx.lineCap  = 'round';
  ctx.lineJoin = 'round';

  if (erase) {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth   = radius * 6;
    ctx.strokeStyle = 'rgba(0,0,0,1)';
    ctx.shadowBlur  = 0;
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.quadraticCurveTo(ctrl.x, ctrl.y, to.x, to.y);
    ctx.stroke();
  } else {
    const [r, g, b] = color;
    ctx.globalCompositeOperation = 'source-over';
    // Glow pass
    ctx.lineWidth   = radius * 2.4;
    ctx.strokeStyle = `rgba(${r},${g},${b},0.06)`;
    ctx.shadowColor = `rgba(${r},${g},${b},0.5)`;
    ctx.shadowBlur  = radius * 3;
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.quadraticCurveTo(ctrl.x, ctrl.y, to.x, to.y);
    ctx.stroke();
    // Core pass
    ctx.lineWidth   = radius;
    ctx.strokeStyle = `rgba(${r},${g},${b},0.88)`;
    ctx.shadowBlur  = radius * 1.5;
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.quadraticCurveTo(ctrl.x, ctrl.y, to.x, to.y);
    ctx.stroke();
  }

  ctx.restore();
}

function onResults(results) {
  const lm = results.multiHandLandmarks?.[0];

  if (!lm) {
    statusEl.textContent = 'Show your hand to the camera';
    modeEl.className = ''; modeEl.textContent = '—';
    cursor.classList.add('hidden');
    resetAll();
    return;
  }

  statusEl.textContent = '';

  const erasing = isErasing(lm);
  const drawing = !erasing && isIndexOnly(lm);

  // Cursor always follows index tip (lm[8]), eraser follows palm center
  const trackLm = erasing ? lm[PALM_CTR] : lm[8];
  const rawX    = (1 - trackLm.x) * canvas.width;   // mirror x
  const rawY    = trackLm.y * canvas.height;

  // Cursor: raw landmark position — glued to the fingertip, zero lag
  cursor.classList.remove('hidden', 'erase');
  cursor.style.left = rawX + 'px';
  cursor.style.top  = rawY + 'px';
  if (erasing) cursor.classList.add('erase');

  // Mode badge
  if (erasing)      { modeEl.className = 'erase'; modeEl.textContent = 'Erase'; }
  else if (drawing) { modeEl.className = 'draw';  modeEl.textContent = 'Draw';  }
  else              { modeEl.className = '';       modeEl.textContent = '—';     }

  if (drawing || erasing) {
    // Drawing uses its own EMA — more responsive than the cursor
    const cur = smoothDraw(rawX, rawY);

    if (pt2 === null) {
      // First anchor of a new stroke
      pt2 = { x: cur.x, y: cur.y };
    } else if (dist(cur, pt2) >= MIN_DIST) {
      // Finger moved enough — commit a new anchor and draw the bezier segment
      const from = pt1 !== null ? mid(pt1, pt2) : pt2;
      const to   = mid(pt2, cur);
      drawSegment(from, pt2, to, erasing, brushPx);
      pt1 = { x: pt2.x, y: pt2.y };
      pt2 = { x: cur.x, y: cur.y };
    }
    // Below MIN_DIST → hold position, no duplicate anchor
  } else {
    // Closed fist or resting — break the stroke
    resetDrawState();
  }
}

// Init Hands
const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});
hands.setOptions({
  maxNumHands:            1,
  modelComplexity:        1,
  minDetectionConfidence: 0.75,
  minTrackingConfidence:  0.6,
});
hands.onResults(onResults);

// Camera feed
const camera = new Camera(video, {
  onFrame: async () => hands.send({ image: video }),
  width: 1280,
  height: 720,
});
camera.start()
  .then(() => { statusEl.textContent = 'Show your hand to the camera'; })
  .catch(e => { statusEl.textContent = 'Camera error — ' + e.message; });
</script>
</body>
</html>
